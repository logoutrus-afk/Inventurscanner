<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d6efd">
<title>Etiketten Scanner</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:#f2f4f7;color:#1a1a1a;padding-bottom:90px}
  header{background:#0d6efd;color:#fff;padding:14px 16px;font-size:18px;font-weight:600;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .container{padding:14px;max-width:640px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  label{display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:500}
  input[type="text"],input[type="number"]{width:100%;padding:12px;font-size:16px;border:1px solid #d5d9e0;border-radius:8px;background:#fafbfc;outline:none;margin-bottom:12px}
  input:focus{border-color:#0d6efd;background:#fff}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:opacity .15s}
  button:active{opacity:.75} button:disabled{opacity:.5}
  .btn-scan{background:#0d6efd;color:#fff} .btn-save{background:#ffc107;color:#212529}
  .btn-barcode-photo{background:#fd7e14;color:#fff}
  .btn-export{background:#6f42c1;color:#fff} .btn-clear{background:#e9ecef;color:#495057;font-weight:500}
  .btn-test{background:#17a2b8;color:#fff}
  .btn-row{display:flex;gap:8px} .btn-row button{margin-bottom:0}
  .counter{display:inline-block;background:#e7f1ff;color:#0d6efd;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}
  .record{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid #0d6efd}
  .record b{color:#0d6efd}
  .record .del{background:#dc3545;color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;padding:0;margin:0;flex-shrink:0}
  #reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;display:none}
  #reader.active{display:block}
  #preview{width:100%;border-radius:12px;margin-bottom:12px;display:none} #preview.active{display:block}
  #progress{display:none;text-align:center;padding:10px;color:#0d6efd;font-size:14px;background:#e7f1ff;border-radius:8px;margin-bottom:10px}
  #progress.active{display:block}
  #bcBox{display:none;margin-bottom:10px;background:#fff8e1;border-left:3px solid #fd7e14;padding:10px;border-radius:8px}
  #bcBox.active{display:block}
  #bcText{width:100%;min-height:60px;font-family:monospace;font-size:13px;padding:8px;border:1px solid #ffc107;border-radius:8px;background:#fff;resize:vertical}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#212529;color:#fff;padding:12px 20px;border-radius:25px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .empty{text-align:center;color:#999;padding:20px;font-size:14px}
  .tips{font-size:12px;color:#666;background:#fff8e1;padding:10px;border-radius:8px;margin-bottom:10px;border-left:3px solid #ffc107}
  #jsError{display:none;background:#dc3545;color:#fff;padding:12px;border-radius:8px;margin-bottom:14px;font-size:13px;word-break:break-word}
  #status{display:block;background:#17a2b8;color:#fff;padding:8px;border-radius:8px;margin-bottom:10px;font-size:13px;text-align:center}
</style>
</head>
<body>

<header>📦 Etiketten Scanner</header>

<div class="container">

  <div id="jsError"></div>
  <div id="status">⏳ Проверка загрузки…</div>

  <div class="card">
    <button class="btn-test" id="btnTest">🧪 Тест: нажми меня</button>
  </div>

  <div class="card">
    <div class="tips">💡 Читается только <b>верхний</b> штрихкод (формат 00NNNNNN/SRxxxxxx).</div>

    <button class="btn-scan" id="btnScan">📹 Сканировать камерой</button>
    <button class="btn-barcode-photo" id="btnBarcodeFromPhoto">▦ Прочитать с фото</button>

    <div id="reader"></div>
    <img id="preview" alt="">
    <div id="progress">Обрабатываю…</div>

    <div id="bcBox">
      <label>📊 Содержимое штрихкода:</label>
      <textarea id="bcText" readonly></textarea>
    </div>

    <label>Materialnummer</label>
    <input type="text" id="material" inputmode="numeric" placeholder="201486" autocomplete="off">

    <label>Name</label>
    <input type="text" id="name" placeholder="ELASTOSIL M 4601 A" autocomplete="off">

    <label>Charge</label>
    <input type="text" id="charge" placeholder="SR104689" autocomplete="off">

    <label>Gewicht (kg)</label>
    <input type="number" id="gewicht" step="0.001" placeholder="300.000" autocomplete="off">

    <button class="btn-save" id="btnSave">💾 Сохранить запись</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong>Записи</strong><span class="counter" id="counter">0</span>
    </div>
    <div id="list"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn-export" id="btnExport">📤 CSV</button>
      <button class="btn-clear" id="btnClear">🗑 Очистить</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  window.__errCount = 0;
  window.addEventListener('error', function(e) {
    window.__errCount++;
    var box = document.getElementById('jsError');
    if (box) {
      box.style.display = 'block';
      box.textContent = '⚠ Ошибка #' + window.__errCount + ': ' + (e.message || 'Неизвестная');
    }
  });
</script>

<script>
  window.__html5qrcodeLoaded = false;
</script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
        onload="window.__html5qrcodeLoaded = true"
        onerror="console.warn('html5-qrcode не загрузился')"></script>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function setVal(id, v) { var el = $(id); if (el) el.value = v; }
  function getVal(id) { var el = $(id); return el ? el.value : ''; }
  function show(id) { var el = $(id); if (el) el.classList.add('active'); }

  function setStatus(txt, color) {
    var el = $('status');
    if (!el) return;
    el.textContent = txt;
    el.style.background = color || '#17a2b8';
  }

  var toastTimer;
  function toast(msg, ms) {
    ms = ms || 2500;
    var t = $('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, ms);
  }

  // ---- Тест ----
  try {
    var testBtn = $('btnTest');
    if (testBtn) {
      testBtn.addEventListener('click', function () {
        var info = [
          'JS работает ✓',
          'html5-qrcode: ' + (window.__html5qrcodeLoaded ? 'загружен' : 'НЕ загружен'),
          'BarcodeDetector: ' + ('BarcodeDetector' in window ? 'есть' : 'нет'),
          'Ошибок JS: ' + window.__errCount
        ];
        alert(info.join('\n'));
      });
    }
  } catch (e) { console.error('Test button error:', e); }

  // ---- Состояние ----
  var records = [];
  try { records = JSON.parse(localStorage.getItem('etiketten_records') || '[]'); } catch (e) { records = []; }

  var html5Qr = null;
  var scanning = false;

  var CATALOG = {
    '201486': { name: 'ELASTOSIL M 4601 A', gewicht: '300.000' }
  };

  // ⚠️ УБРАЛИ восстановление Name из localStorage
  // При каждом открытии — поле чистое.
  // Если хотите очищать ещё и другие поля — раскомментируйте строки ниже:
  // setVal('material', '');
  // setVal('charge', '');
  // setVal('gewicht', '');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function isValidBarcode(raw) {
    if (!raw) return false;
    var s = String(raw).trim();
    if (/^\d{9,}$/.test(s)) return false;
    if (/^\d{4,10}\s*[\/\\\-]\s*[A-Z]{1,4}\s*\d{5,10}$/i.test(s)) return true;
    if (/^[A-Z]{1,4}\d{5,10}$/i.test(s)) return true;
    if (/\(\d{2,4}\)/.test(s) || /\x1D/.test(s)) return true;
    if (/S[RB]?\s?\d{6,8}/i.test(s)) return true;
    return false;
  }

  function render() {
    var list = $('list');
    var counter = $('counter');
    if (!list) return;
    if (counter) counter.textContent = records.length;
    if (!records.length) {
      list.innerHTML = '<div class="empty">Пока пусто.</div>';
      return;
    }
    list.innerHTML = records.map(function(r, i){
      return '<div class="record"><div>' +
        '<div><b>' + esc(r.material || '—') + '</b> · ' + esc(r.name || '—') + '</div>' +
        '<div style="font-size:12px;color:#666;margin-top:2px">Charge: ' + esc(r.charge || '—') + ' · ' + esc(r.gewicht || '—') + ' kg</div>' +
        '</div><button class="del" data-i="' + i + '">×</button></div>';
    }).join('');
  }

  // ============================================================
  //  СОХРАНЕНИЕ
  // ============================================================
  try {
    var saveBtn = $('btnSave');
    if (saveBtn) {
      saveBtn.addEventListener('click', function () {
        try {
          var material = getVal('material').trim();
          var name = getVal('name').trim();
          var charge = getVal('charge').trim();
          var gewicht = getVal('gewicht').trim();
          if (!material && !charge) { toast('Заполните Materialnummer или Charge'); return; }

          // ⚠️ УБРАЛИ сохранение name в localStorage
          // if (name) localStorage.setItem('etiketten_last_name', name);

          records.push({ material: material, name: name, charge: charge, gewicht: gewicht });
          localStorage.setItem('etiketten_records', JSON.stringify(records));
          render();

          // Очищаем ВСЕ поля после сохранения
          setVal('material', '');
          setVal('name', '');
          setVal('charge', '');
          setVal('gewicht', '');

          var m = $('material'); if (m) m.focus();
          toast('Сохранено ✓');
        } catch (e) {
          alert('Ошибка сохранения: ' + (e.message || e));
        }
      });
    }
  } catch (e) { console.error('Save button error:', e); }

  try {
    var listEl = $('list');
    if (listEl) {
      listEl.addEventListener('click', function (e) {
        var t = e.target;
        if (t && t.classList && t.classList.contains('del')) {
          var idx = parseInt(t.dataset.i, 10);
          if (!isNaN(idx)) {
            records.splice(idx, 1);
            localStorage.setItem('etiketten_records', JSON.stringify(records));
            render();
          }
        }
      });
    }
  } catch (e) { console.error('List error:', e); }

  try {
    var clearBtn = $('btnClear');
    if (clearBtn) {
      clearBtn.addEventListener('click', function () {
        if (!records.length) return;
        if (!confirm('Удалить все записи?')) return;
        records = [];
        localStorage.removeItem('etiketten_records');
        render();
        toast('Удалено');
      });
    }
  } catch (e) { console.error('Clear error:', e); }

  try {
    var exportBtn = $('btnExport');
    if (exportBtn) {
      exportBtn.addEventListener('click', function () {
        try {
          if (!records.length) { toast('Нет данных'); return; }
          var rows = ['Materialnummer;Name;Charge;Gewicht'];
          records.forEach(function (r) {
            rows.push([r.material, r.name, r.charge, r.gewicht].map(function (v) {
              v = String(v == null ? '' : v);
              return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
            }).join(';'));
          });
          var csv = '\uFEFF' + rows.join('\n');
          var filename = 'scan_export_' + new Date().toISOString().slice(0, 10) + '.csv';
          try {
            var f = new File([csv], filename, { type: 'text/csv' });
            if (navigator.canShare && navigator.canShare({ files: [f] })) {
              navigator.share({ files: [f], title: 'Scan Export' })
                .catch(function(){ downloadFallback(csv, filename); });
              return;
            }
          } catch (e) {}
          downloadFallback(csv, filename);
        } catch (e) {
          alert('Ошибка экспорта: ' + (e.message || e));
        }
      });
    }
  } catch (e) { console.error('Export error:', e); }

  function downloadFallback(csv, filename) {
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast('Файл сохранён');
  }

  // ============================================================
  //  ПАРСЕР ШТРИХКОДА
  // ============================================================
  function parseBarcode(raw) {
    if (!raw) return;
    raw = String(raw).trim();

    var m = raw.match(/^(\d+)\s*[\/\\\-]\s*([A-Z]{1,4}\s*\d{5,10})$/i);
    if (m) { fillFromCustomFormat(m[1], m[2]); return; }

    m = raw.match(/^([A-Z]{1,4}\d{5,10})$/i);
    if (m) { setVal('charge', m[1].toUpperCase()); toast('Только Charge'); return; }

    if (parseGS1(raw)) return;

    var sr = raw.toUpperCase().match(/S[RB]?\s?(\d{6,8})/);
    if (sr) setVal('charge', 'SR' + sr[1]);

    var m6 = raw.match(/(?:^|[^\d])(\d{6})(?!\d)/);
    if (m6) { setVal('material', m6[1]); fillFromCatalog(m6[1]); }
    toast('Разобрано частично');
  }

  function fillFromCustomFormat(matRaw, chargeRaw) {
    var material = matRaw.replace(/^0+/, '');
    if (material.length !== 6) {
      var m6 = matRaw.match(/(\d{6})$/);
      if (m6) material = m6[1];
    }
    var charge = chargeRaw.replace(/\s/g, '').toUpperCase();
    setVal('material', material);
    setVal('charge', charge);
    fillFromCatalog(material);
    toast('Штрихкод разобран ✓');
  }

  function fillFromCatalog(material) {
    if (!material) return;
    var entry = CATALOG[material];
    if (!entry) return;
    // Заполняем только если поле пустое
    if (entry.name && !getVal('name').trim()) setVal('name', entry.name);
    if (entry.gewicht && !getVal('gewicht').trim()) setVal('gewicht', entry.gewicht);
  }

  function parseGS1(raw) {
    var s = raw.replace(/\x1D/g,'|').replace(/<GS>/gi,'|').replace(/\((\d{2,4})\)/g,'|$1|').replace(/\s+/g,' ');
    if (!/\|?\d{2,4}[|\s]/.test(s)) return false;
    var result = {}, m;
    m = s.match(/(?:^|\|)01[|\s]?(\d{14})/); if (m) result.gtin = m[1];
    m = s.match(/(?:^|\|)10[|\s]?([^|\s]{1,20})/); if (m) result.charge = m[1].toUpperCase();
    m = s.match(/(?:^|\|)3103[|\s]?(\d{6})/); if (m) result.gewicht = (parseInt(m[1],10)/1000).toFixed(3);
    if (!result.charge && !result.gtin) return false;
    if (result.gtin) {
      var mat = result.gtin.replace(/^0+/, '');
      var m6 = mat.match(/(\d{6})$/);
      if (m6) { setVal('material', m6[1]); fillFromCatalog(m6[1]); }
    }
    if (result.charge && !getVal('charge')) setVal('charge', 'SR' + result.charge.replace(/^SR/i,''));
    if (result.gewicht && !getVal('gewicht')) setVal('gewicht', result.gewicht);
    toast('GS1-128 ✓');
    return true;
  }

  // ============================================================
  //  КАМЕРНЫЙ СКАНЕР
  // ============================================================
  try {
    var scanBtn = $('btnScan');
    if (scanBtn) {
      scanBtn.addEventListener('click', function () {
        if (scanning) { stopScan(); return; }
        if (typeof Html5Qrcode === 'undefined') {
          alert('Сканер html5-qrcode не загружен. Проверьте интернет и обновите страницу.');
          return;
        }
        var reader = $('reader');
        var btn = $('btnScan');
        if (!reader || !btn) return;
        reader.classList.add('active');
        btn.textContent = '⏹ Остановить';
        try {
          html5Qr = new Html5Qrcode('reader');
          html5Qr.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 300, height: 180 } },
            function (text) {
              if (!isValidBarcode(text)) {
                console.log('Игнорирую:', text);
                if (navigator.vibrate) navigator.vibrate(30);
                return;
              }
              var bct = $('bcText'); if (bct) bct.value = text;
              show('bcBox');
              parseBarcode(text);
              if (navigator.vibrate) navigator.vibrate(100);
              stopScan();
            },
            function () {}
          ).then(function(){ scanning = true; })
           .catch(function(e){
             alert('Ошибка камеры: ' + (e.message||e));
             stopScan();
           });
        } catch (e) {
          alert('Ошибка запуска: ' + (e.message||e));
          stopScan();
        }
      });
    }
  } catch (e) { console.error('Scan button error:', e); }

  function stopScan() {
    scanning = false;
    try {
      if (html5Qr) {
        html5Qr.stop().then(function(){ return html5Qr.clear(); })
          .catch(function(){}).finally(function(){ html5Qr = null; });
      }
    } catch (e) {}
    var r = $('reader'); if (r) r.classList.remove('active');
    var b = $('btnScan'); if (b) b.textContent = '📹 Сканировать камерой';
  }

  // ============================================================
  //  ЧТЕНИЕ С ФОТО
  // ============================================================
  try {
    var photoBtn = $('btnBarcodeFromPhoto');
    if (photoBtn) {
      photoBtn.addEventListener('click', function () {
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.onchange = function () {
          if (inp.files && inp.files[0]) scanBarcodeFromImage(inp.files[0]);
        };
        inp.click();
      });
    }
  } catch (e) { console.error('Photo button error:', e); }

  function loadImageFromFile(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('Не удалось открыть файл')); };
      img.src = URL.createObjectURL(file);
    });
  }

  function applyFilterToImageData(d, N, filter) {
    var gray = new Uint8ClampedArray(N);
    for (var i = 0, j = 0; i < d.length; i += 4, j++) {
      gray[j] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    }
    if (filter === 'gray') {
      for (var j2 = 0; j2 < N; j2++) {
        var v = (gray[j2] - 128) * 1.7 + 128;
        v = Math.max(0, Math.min(255, v));
        d[j2*4] = d[j2*4+1] = d[j2*4+2] = v;
      }
    } else if (filter === 'binary') {
      var hist = new Array(256).fill(0);
      for (var j3 = 0; j3 < N; j3++) hist[gray[j3] | 0]++;
      var total = N, sum = 0;
      for (var k = 0; k < 256; k++) sum += k * hist[k];
      var sumB = 0, wB = 0, maxVar = 0, thr = 128;
      for (var t = 0; t < 256; t++) {
        wB += hist[t]; if (!wB) continue;
        var wF = total - wB; if (!wF) break;
        sumB += t * hist[t];
        var mB = sumB / wB, mF = (sum - sumB) / wF;
        var between = wB * wF * (mB - mF) * (mB - mF);
        if (between > maxVar) { maxVar = between; thr = t; }
      }
      for (var j4 = 0; j4 < N; j4++) {
        var val = gray[j4] > thr ? 255 : 0;
        d[j4*4] = d[j4*4+1] = d[j4*4+2] = val;
      }
    }
  }

  function renderPlan(img, plan) {
    return new Promise(function (resolve, reject) {
      try {
        var cropFrom = plan.crop[0], cropTo = plan.crop[1];
        var srcY = Math.floor(img.height * cropFrom);
        var srcH = Math.floor(img.height * (cropTo - cropFrom));
        var srcW = img.width;
        if (srcH < 20 || srcW < 20) { reject(new Error('Слишком маленькая область')); return; }

        var scale = plan.scale || 1;
        var w = Math.round(srcW * scale);
        var h = Math.round(srcH * scale);
        var maxSide = 4000;
        if (Math.max(w, h) > maxSide) {
          var r = maxSide / Math.max(w, h);
          w = Math.round(w * r); h = Math.round(h * r);
        }

        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var rotate = plan.rotate || 0;

        if (rotate === 90 || rotate === 270) {
          canvas.width = h; canvas.height = w;
          ctx.translate(canvas.width/2, canvas.height/2);
          ctx.rotate(rotate * Math.PI / 180);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, srcY, srcW, srcH, -w/2, -h/2, w, h);
        } else {
          canvas.width = w; canvas.height = h;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, srcY, srcW, srcH, 0, 0, w, h);
        }

        if (plan.filter && plan.filter !== 'orig') {
          var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          applyFilterToImageData(imgData.data, canvas.width * canvas.height, plan.filter);
          ctx.putImageData(imgData, 0, 0);
        }

        canvas.toBlob(function (blob) {
          if (blob) resolve(blob); else reject(new Error('toBlob failed'));
        }, 'image/png');
      } catch (e) { reject(e); }
    });
  }

  var nativeDetector = null;
  try {
    if ('BarcodeDetector' in window) {
      nativeDetector = new BarcodeDetector({
        formats: ['code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','qr_code']
      });
      console.log('BarcodeDetector OK');
    }
  } catch (e) {
    console.warn('BarcodeDetector init failed:', e);
    nativeDetector = null;
  }

  async function tryNativeDetect(blob) {
    if (!nativeDetector) return null;
    try {
      var bmp = await createImageBitmap(blob);
      try {
        var codes = await nativeDetector.detect(bmp);
        if (codes && codes.length) return codes.map(function(c){ return c.rawValue; });
      } finally {
        if (bmp.close) bmp.close();
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  function tryHtml5Qrcode(blob) {
    return new Promise(function (resolve, reject) {
      if (typeof Html5Qrcode === 'undefined') {
        reject(new Error('html5-qrcode не загружен'));
        return;
      }
      var tempDiv = document.createElement('div');
      tempDiv.id = 'rdr-' + Date.now() + '-' + Math.random();
      tempDiv.style.position = 'fixed';
      tempDiv.style.left = '-10000px';
      tempDiv.style.top = '0';
      tempDiv.style.width = '400px';
      tempDiv.style.height = '300px';
      document.body.appendChild(tempDiv);

      var scanner;
      try {
        scanner = new Html5Qrcode(tempDiv.id, { verbose: false });
      } catch (e) {
        if (tempDiv.parentNode) tempDiv.parentNode.removeChild(tempDiv);
        reject(e); return;
      }

      var f;
      try { f = new File([blob], 's.png', { type: 'image/png' }); } catch (e) { f = blob; }

      scanner.scanFile(f, false)
        .then(function (r) {
          if (tempDiv.parentNode) tempDiv.parentNode.removeChild(tempDiv);
          resolve([r]);
        })
        .catch(function (err) {
          if (tempDiv.parentNode) tempDiv.parentNode.removeChild(tempDiv);
          reject(err);
        });
    });
  }

  function applyBarcode(code, source) {
    var bct = $('bcText');
    if (bct) bct.value = code + (source ? '  [' + source + ']' : '');
    show('bcBox');
    parseBarcode(code);
    toast('Штрихкод прочитан ✓ (' + source + ')');
  }

  async function scanBarcodeFromImage(file) {
    var preview = $('preview');
    if (preview) { preview.src = URL.createObjectURL(file); preview.classList.add('active'); }
    var prog = $('progress');
    if (prog) { prog.classList.add('active'); prog.textContent = 'Готовлю…'; }
    var btn = $('btnBarcodeFromPhoto');
    if (btn) btn.disabled = true;

    var ignored = [];
    var lastErr = null;

    try {
      var img = await loadImageFromFile(file);

      var plans = [];
      [1, 1.5, 2, 3].forEach(function(s){ plans.push({ scale: s, filter: 'orig',   crop: [0, 1] }); });
      [1, 1.5, 2].forEach(function(s){ plans.push({ scale: s, filter: 'gray',   crop: [0, 1] }); });
      [1, 1.5, 2].forEach(function(s){ plans.push({ scale: s, filter: 'binary', crop: [0, 1] }); });
      [1.5, 2, 3].forEach(function(s){ plans.push({ scale: s, filter: 'orig',   crop: [0, 0.55] }); });
      [1.5, 2].forEach(function(s){
        plans.push({ scale: s, filter: 'gray',   crop: [0, 0.55] });
        plans.push({ scale: s, filter: 'binary', crop: [0, 0.55] });
      });
      [2, 3].forEach(function(s){
        plans.push({ scale: s, filter: 'orig',   crop: [0, 0.35] });
        plans.push({ scale: s, filter: 'binary', crop: [0, 0.35] });
      });
      [90, 180, 270].forEach(function(rot){
        plans.push({ scale: 1.5, filter: 'gray', crop: [0, 1], rotate: rot });
      });

      for (var i = 0; i < plans.length; i++) {
        var plan = plans[i];
        var label = 'Попытка ' + (i+1) + '/' + plans.length;
        if (prog) prog.textContent = label + '…';

        var blob;
        try { blob = await renderPlan(img, plan); }
        catch (e) { lastErr = e; continue; }

        var nativeResults = null;
        try { nativeResults = await tryNativeDetect(blob); } catch (e) {}

        if (nativeResults && nativeResults.length) {
          var foundNative = null;
          for (var n = 0; n < nativeResults.length; n++) {
            if (isValidBarcode(nativeResults[n])) { foundNative = nativeResults[n]; break; }
            else ignored.push(nativeResults[n]);
          }
          if (foundNative) {
            if (prog) prog.classList.remove('active');
            if (btn) btn.disabled = false;
            applyBarcode(foundNative, label + ' native');
            return;
          }
        }

        var results = null;
        try { results = await tryHtml5Qrcode(blob); } catch (e) { lastErr = e; }

        if (results && results.length) {
          var foundH5 = null;
          for (var h = 0; h < results.length; h++) {
            if (isValidBarcode(results[h])) { foundH5 = results[h]; break; }
            else ignored.push(results[h]);
          }
          if (foundH5) {
            if (prog) prog.classList.remove('active');
            if (btn) btn.disabled = false;
            applyBarcode(foundH5, label);
            return;
          }
        }
      }

      var msg = 'Не найден верхний штрихкод после ' + plans.length + ' попыток.';
      if (ignored.length) {
        var uniq = [];
        ignored.forEach(function(x){ if (uniq.indexOf(x) === -1) uniq.push(x); });
        msg += '\n\nПрочитаны, но проигнорированы:\n' + uniq.slice(0, 10).join('\n');
      }
      msg += '\n\nСовет: сфотографируйте верхний штрихкод крупно, без бликов.';
      if (lastErr) msg += '\n\nОшибка: ' + (lastErr.message || lastErr);
      var bct = $('bcText'); if (bct) bct.value = msg;
      show('bcBox');
      toast('Верхний штрихкод не найден', 4000);

    } catch (e) {
      alert('Ошибка: ' + (e.message || e));
    } finally {
      if (prog) prog.classList.remove('active');
      if (btn) btn.disabled = false;
    }
  }

  // ============================================================
  //  СТАРТ
  // ============================================================
  try { render(); } catch (e) { console.error('Render error:', e); }

  setTimeout(function () {
    var libs = [];
    libs.push(window.__html5qrcodeLoaded ? 'html5-qrcode ✓' : 'html5-qrcode ✗');
    libs.push(nativeDetector ? 'BarcodeDetector ✓' : 'BarcodeDetector ✗');
    setStatus('✅ Загружено: ' + libs.join(' | '), '#198754');
  }, 1000);

  console.log('Scanner initialized');

})();
</script>
</body>
