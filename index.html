<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d6efd">
<title>Etiketten Scanner</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:#f2f4f7;color:#1a1a1a;padding-bottom:90px}
  header{background:#0d6efd;color:#fff;padding:14px 16px;font-size:18px;font-weight:600;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .container{padding:14px;max-width:640px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  label{display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:500}
  input[type="text"],input[type="number"]{width:100%;padding:12px;font-size:16px;border:1px solid #d5d9e0;border-radius:8px;background:#fafbfc;outline:none;margin-bottom:12px}
  input:focus{border-color:#0d6efd;background:#fff}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:opacity .15s}
  button:active{opacity:.75} button:disabled{opacity:.5}
  .btn-scan{background:#0d6efd;color:#fff} .btn-save{background:#ffc107;color:#212529}
  .btn-barcode-photo{background:#fd7e14;color:#fff}
  .btn-export{background:#6f42c1;color:#fff} .btn-clear{background:#e9ecef;color:#495057;font-weight:500}
  .btn-row{display:flex;gap:8px} .btn-row button{margin-bottom:0}
  .counter{display:inline-block;background:#e7f1ff;color:#0d6efd;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}
  .record{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid #0d6efd}
  .record b{color:#0d6efd}
  .record .del{background:#dc3545;color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;padding:0;margin:0;flex-shrink:0}
  #reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;display:none}
  #reader.active{display:block}
  #preview{width:100%;border-radius:12px;margin-bottom:12px;display:none} #preview.active{display:block}
  #progress{display:none;text-align:center;padding:10px;color:#0d6efd;font-size:14px;background:#e7f1ff;border-radius:8px;margin-bottom:10px}
  #progress.active{display:block}
  #bcBox{display:none;margin-bottom:10px;background:#fff8e1;border-left:3px solid #fd7e14;padding:10px;border-radius:8px}
  #bcBox.active{display:block}
  #bcText{width:100%;min-height:60px;font-family:monospace;font-size:13px;padding:8px;border:1px solid #ffc107;border-radius:8px;background:#fff;resize:vertical}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#212529;color:#fff;padding:12px 20px;border-radius:25px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .empty{text-align:center;color:#999;padding:20px;font-size:14px}
  .tips{font-size:12px;color:#666;background:#fff8e1;padding:10px;border-radius:8px;margin-bottom:10px;border-left:3px solid #ffc107}
  #jsError{display:none;background:#dc3545;color:#fff;padding:12px;border-radius:8px;margin-bottom:14px;font-size:13px;word-break:break-word}
</style>
</head>
<body>

<header>📦 Etiketten Scanner</header>

<div class="container">

  <div id="jsError"></div>

  <div class="card">
    <div class="tips">💡 Читается только <b>верхний</b> штрихкод (формат 00NNNNNN/SRxxxxxx). Нижний игнорируется.</div>

    <button class="btn-scan" id="btnScan">📹 Сканировать камерой</button>
    <button class="btn-barcode-photo" id="btnBarcodeFromPhoto">▦ Прочитать с фото (усиленный режим)</button>

    <div id="reader"></div>
    <img id="preview" alt="">
    <div id="progress">Обрабатываю…</div>

    <div id="bcBox">
      <label>📊 Содержимое штрихкода:</label>
      <textarea id="bcText" readonly></textarea>
    </div>

    <label>Materialnummer</label>
    <input type="text" id="material" inputmode="numeric" placeholder="201486">

    <label>Name</label>
    <input type="text" id="name" placeholder="ELASTOSIL M 4601 A">

    <label>Charge</label>
    <input type="text" id="charge" placeholder="SR104689">

    <label>Gewicht (kg)</label>
    <input type="number" id="gewicht" step="0.001" placeholder="300.000">

    <button class="btn-save" id="btnSave">💾 Сохранить запись</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong>Записи</strong><span class="counter" id="counter">0</span>
    </div>
    <div id="list"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn-export" id="btnExport">📤 CSV</button>
      <button class="btn-clear" id="btnClear">🗑 Очистить</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  window.addEventListener('error', function(e) {
    var box = document.getElementById('jsError');
    if (box) {
      box.style.display = 'block';
      box.textContent = '⚠ Ошибка: ' + (e.message || 'Неизвестная');
    }
  });
</script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="alert('Не загрузился html5-qrcode')"></script>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function on(id, evt, fn) { var el = $(id); if (el) el.addEventListener(evt, fn); return el; }
  function setVal(id, v) { var el = $(id); if (el) el.value = v; }
  function getVal(id) { var el = $(id); return el ? el.value : ''; }
  function show(id) { var el = $(id); if (el) el.classList.add('active'); }

  var records = [];
  try { records = JSON.parse(localStorage.getItem('etiketten_records') || '[]'); } catch (e) { records = []; }
  var html5Qr = null;
  var scanning = false;

  var CATALOG = {
    '201486': { name: 'ELASTOSIL M 4601 A', gewicht: '300.000' }
  };

  var savedName = localStorage.getItem('etiketten_last_name') || '';
  setVal('name', savedName);

  var toastTimer;
  function toast(msg, ms) {
    ms = ms || 2500;
    var t = $('toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, ms);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render() {
    var list = $('list'); var counter = $('counter');
    if (!list) return;
    if (counter) counter.textContent = records.length;
    if (!records.length) { list.innerHTML = '<div class="empty">Пока пусто.</div>'; return; }
    list.innerHTML = records.map(function(r, i){
      return '<div class="record"><div>' +
        '<div><b>' + esc(r.material || '—') + '</b> · ' + esc(r.name || '—') + '</div>' +
        '<div style="font-size:12px;color:#666;margin-top:2px">Charge: ' + esc(r.charge || '—') + ' · ' + esc(r.gewicht || '—') + ' kg</div>' +
        '</div><button class="del" data-i="' + i + '">×</button></div>';
    }).join('');
  }

  // ---------- ПРОВЕРКА ШТРИХКОДА ----------
  function isValidBarcode(raw) {
    if (!raw) return false;
    var s = String(raw).trim();
    // Отвергаем чисто числовые коды длиной ≥9 (нижний штрихкод)
    if (/^\d{9,}$/.test(s)) return false;
    // 00NNNNNN/SRxxxxxx
    if (/^\d{4,10}\s*[\/\\\-]\s*[A-Z]{1,4}\s*\d{5,10}$/i.test(s)) return true;
    // Просто SRxxxxxx
    if (/^[A-Z]{1,4}\d{5,10}$/i.test(s)) return true;
    // GS1
    if (/\(\d{2,4}\)/.test(s) || /\x1D/.test(s)) return true;
    // Есть SR + цифры
    if (/S[RB]?\s?\d{6,8}/i.test(s)) return true;
    return false;
  }

  // ============================================================
  //  СОХРАНЕНИЕ / CSV
  // ============================================================
  on('btnSave', 'click', function () {
    var material = getVal('material').trim(), name = getVal('name').trim(),
        charge = getVal('charge').trim(), gewicht = getVal('gewicht').trim();
    if (!material && !charge) { toast('Заполните Materialnummer или Charge'); return; }
    if (name) localStorage.setItem('etiketten_last_name', name);
    records.push({ material: material, name: name, charge: charge, gewicht: gewicht });
    localStorage.setItem('etiketten_records', JSON.stringify(records));
    render();
    setVal('material',''); setVal('charge',''); setVal('gewicht','');
    var m = $('material'); if (m) m.focus();
    toast('Сохранено ✓');
  });
  on('list', 'click', function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('del')) {
      var idx = parseInt(t.dataset.i, 10);
      if (!isNaN(idx)) {
        records.splice(idx, 1);
        localStorage.setItem('etiketten_records', JSON.stringify(records));
        render();
      }
    }
  });
  on('btnClear', 'click', function () {
    if (!records.length || !confirm('Удалить все записи?')) return;
    records = []; localStorage.removeItem('etiketten_records'); render(); toast('Удалено');
  });
  on('btnExport', 'click', function () {
    if (!records.length) { toast('Нет данных'); return; }
    var rows = ['Materialnummer;Name;Charge;Gewicht'];
    records.forEach(function (r) {
      rows.push([r.material, r.name, r.charge, r.gewicht].map(function (v) {
        v = String(v == null ? '' : v);
        return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(';'));
    });
    var csv = '\uFEFF' + rows.join('\n');
    var filename = 'scan_export_' + new Date().toISOString().slice(0, 10) + '.csv';
    try {
      var f = new File([csv], filename, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: 'Scan Export' }).catch(function(){ downloadFallback(csv, filename); });
        return;
      }
    } catch (e) {}
    downloadFallback(csv, filename);
  });
  function downloadFallback(csv, filename) {
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast('Файл сохранён');
  }

  // ============================================================
  //  ПРЕДОБРАБОТКА ИЗОБРАЖЕНИЯ
  // ============================================================
  function loadImageFromFile(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('Не удалось открыть файл')); };
      img.src = URL.createObjectURL(file);
    });
  }

  function applyFilter(d, N, filter) {
    // Grayscale
    var gray = new Uint8ClampedArray(N);
    for (var i = 0, j = 0; i < d.length; i += 4, j++) {
      gray[j] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    }

    if (filter === 'gray') {
      for (var j2 = 0; j2 < N; j2++) {
        var v = (gray[j2] - 128) * 1.7 + 128;
        v = Math.max(0, Math.min(255, v));
        d[j2*4] = d[j2*4+1] = d[j2*4+2] = v;
      }
    } else if (filter === 'binary') {
      // Otsu
      var hist = new Array(256).fill(0);
      for (var j3 = 0; j3 < N; j3++) hist[gray[j3] | 0]++;
      var total = N, sum = 0;
      for (var k = 0; k < 256; k++) sum += k * hist[k];
      var sumB = 0, wB = 0, maxVar = 0, thr = 128;
      for (var t = 0; t < 256; t++) {
        wB += hist[t]; if (!wB) continue;
        var wF = total - wB; if (!wF) break;
        sumB += t * hist[t];
        var mB = sumB / wB, mF = (sum - sumB) / wF;
        var between = wB * wF * (mB - mF) * (mB - mF);
        if (between > maxVar) { maxVar = between; thr = t; }
      }
      for (var j4 = 0; j4 < N; j4++) {
        var val = gray[j4] > thr ? 255 : 0;
        d[j4*4] = d[j4*4+1] = d[j4*4+2] = val;
      }
    } else if (filter === 'invert') {
      for (var j5 = 0; j5 < N; j5++) {
        var val2 = 255 - gray[j5];
        d[j5*4] = d[j5*4+1] = d[j5*4+2] = val2;
      }
    } else if (filter === 'sharp') {
      // Резкость 3x3
      var w = Math.round(Math.sqrt(N));
      var h = N / w;
      var copy = new Uint8ClampedArray(gray);
      var kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];
      for (var y = 1; y < h - 1; y++) {
        for (var x = 1; x < w - 1; x++) {
          var sum = 0;
          var ki = 0;
          for (var dy = -1; dy <= 1; dy++) {
            for (var dx = -1; dx <= 1; dx++) {
              sum += copy[(y+dy)*w + (x+dx)] * kernel[ki++];
            }
          }
          gray[y*w + x] = Math.max(0, Math.min(255, sum));
        }
      }
      for (var j6 = 0; j6 < N; j6++) {
        d[j6*4] = d[j6*4+1] = d[j6*4+2] = gray[j6];
      }
    }
  }

  function renderPlan(img, plan) {
    return new Promise(function (resolve, reject) {
      try {
        var cropFrom = plan.crop[0], cropTo = plan.crop[1];
        var srcY = Math.floor(img.height * cropFrom);
        var srcH = Math.floor(img.height * (cropTo - cropFrom));
        var srcW = img.width;
        if (srcH < 20 || srcW < 20) { reject(new Error('Слишком маленькая область')); return; }

        var scale = plan.scale || 1;
        var w = Math.round(srcW * scale);
        var h = Math.round(srcH * scale);
        var maxSide = 4000;
        if (Math.max(w, h) > maxSide) {
          var r = maxSide / Math.max(w, h);
          w = Math.round(w * r); h = Math.round(h * r);
        }

        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var rotate = plan.rotate || 0;

        if (rotate === 90 || rotate === 270) {
          canvas.width = h; canvas.height = w;
          ctx.translate(canvas.width/2, canvas.height/2);
          ctx.rotate(rotate * Math.PI / 180);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, srcY, srcW, srcH, -w/2, -h/2, w, h);
        } else if (rotate === 180) {
          canvas.width = w; canvas.height = h;
          ctx.translate(w/2, h/2);
          ctx.rotate(Math.PI);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, srcY, srcW, srcH, -w/2, -h/2, w, h);
        } else {
          canvas.width = w; canvas.height = h;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, srcY, srcW, srcH, 0, 0, w, h);
        }

        if (plan.filter && plan.filter !== 'orig') {
          var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          applyFilter(imgData.data, canvas.width * canvas.height, plan.filter);
          ctx.putImageData(imgData, 0, 0);
        }

        canvas.toBlob(function (blob) {
          if (blob) resolve(blob); else reject(new Error('toBlob failed'));
        }, 'image/png');
      } catch (e) { reject(e); }
    });
  }

  // ============================================================
  //  НАТИВНЫЙ BARCODEDETECTOR (Chrome Android)
  // ============================================================
  var nativeDetector = null;
  if ('BarcodeDetector' in window) {
    try {
      nativeDetector = new BarcodeDetector({
        formats: ['code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','qr_code']
      });
      console.log('BarcodeDetector доступен');
    } catch (e) { nativeDetector = null; }
  } else {
    console.log('BarcodeDetector не поддерживается, используем html5-qrcode');
  }

  async function tryNativeDetect(blob) {
    if (!nativeDetector) return null;
    try {
      var bmp = await createImageBitmap(blob);
      try {
        var codes = await nativeDetector.detect(bmp);
        if (codes && codes.length) {
          return codes.map(function(c){ return c.rawValue; });
        }
      } finally {
        if (bmp.close) bmp.close();
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  // ============================================================
  //  HTML5-QRCODE СКАНЕР
  // ============================================================
  function tryHtml5Qrcode(blob) {
    return new Promise(function (resolve, reject) {
      var tempDiv = document.createElement('div');
      tempDiv.id = 'rdr-' + Date.now() + '-' + Math.random();
      tempDiv.style.position = 'fixed';
      tempDiv.style.left = '-10000px';
      tempDiv.style.top = '0';
      tempDiv.style.width = '400px';
      tempDiv.style.height = '300px';
      document.body.appendChild(tempDiv);

      var scanner;
      try {
        scanner = new Html5Qrcode(tempDiv.id, {
          verbose: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        });
      } catch (e) {
        if (tempDiv.parentNode) tempDiv.parentNode.removeChild(tempDiv);
        reject(e); return;
      }

      var f;
      try { f = new File([blob], 's.png', { type: 'image/png' }); } catch (e) { f = blob; }

      scanner.scanFile(f, false)
        .then(function (r) {
          if (tempDiv.parentNode) tempDiv.parentNode.removeChild(tempDiv);
          resolve([r]);
        })
        .catch(function (err) {
          if (tempDiv.parentNode) tempDiv.parentNode.removeChild(tempDiv);
          reject(err);
        });
    });
  }

  // ============================================================
  //  ГЛАВНЫЙ ПАЙПЛАЙН СКАНИРОВАНИЯ С ФОТО
  // ============================================================
  on('btnBarcodeFromPhoto', 'click', function () {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = function () {
      if (inp.files && inp.files[0]) scanBarcodeFromImage(inp.files[0]);
    };
    inp.click();
  });

  async function scanBarcodeFromImage(file) {
    var preview = $('preview');
    if (preview) { preview.src = URL.createObjectURL(file); preview.classList.add('active'); }
    var prog = $('progress');
    if (prog) { prog.classList.add('active'); prog.textContent = 'Готовлю изображение…'; }
    var btn = $('btnBarcodeFromPhoto');
    if (btn) btn.disabled = true;

    var ignored = [];
    var lastErr = null;

    try {
      var img = await loadImageFromFile(file);

      // План: массив попыток
      var plans = [];

      // 1) Оригинал, разные масштабы
      [1, 1.5, 2, 3].forEach(function(s){
        plans.push({ scale: s, filter: 'orig', crop: [0, 1] });
      });

      // 2) Grayscale + контраст
      [1, 1.5, 2].forEach(function(s){
        plans.push({ scale: s, filter: 'gray', crop: [0, 1] });
      });

      // 3) Бинаризация
      [1, 1.5, 2].forEach(function(s){
        plans.push({ scale: s, filter: 'binary', crop: [0, 1] });
      });

      // 4) Резкость + grayscale
      [1.5, 2].forEach(function(s){
        plans.push({ scale: s, filter: 'sharp', crop: [0, 1] });
      });

      // 5) Верхняя половина (там верхний штрихкод)
      [1.5, 2, 3].forEach(function(s){
        plans.push({ scale: s, filter: 'orig', crop: [0, 0.55] });
      });
      [1.5, 2].forEach(function(s){
        plans.push({ scale: s, filter: 'gray', crop: [0, 0.55] });
        plans.push({ scale: s, filter: 'binary', crop: [0, 0.55] });
      });

      // 6) Верхние 35%
