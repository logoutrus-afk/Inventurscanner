<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Etiketten Scanner</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f2f4f7;padding-bottom:80px}
  header{background:#0d6efd;color:#fff;padding:14px;font-size:18px;font-weight:600}
  .container{max-width:640px;margin:0 auto;padding:14px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:13px;color:#555;margin:8px 0 4px}
  input,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin-bottom:8px}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:10px;margin-bottom:8px;color:#fff}
  .b1{background:#0d6efd}.b2{background:#fd7e14}.b3{background:#ffc107;color:#000}
  .b4{background:#6f42c1}.b5{background:#e9ecef;color:#333}
  #reader{display:none;margin-bottom:10px}
  #reader.on{display:block}
  .row{display:flex;gap:8px}.row button{margin:0}
  .rec{background:#f8f9fa;border-radius:8px;padding:8px;margin-bottom:6px;font-size:14px;display:flex;justify-content:space-between}
  .del{background:#dc3545;color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:16px;padding:0;margin:0}
  .tip{font-size:12px;background:#fff3cd;padding:8px;border-radius:8px;margin-bottom:8px}
  .status{font-size:13px;color:#0d6efd;padding:6px;text-align:center;min-height:22px}
</style>
</head>
<body>

<header>📦 Etiketten Scanner</header>
<div class="container">

  <div class="card">
    <div class="tip">💡 Сканируйте верхний штрихкод. Нижний игнорируется автоматически.</div>
    <button class="b1" id="scanBtn">📹 Сканировать камерой</button>
    <button class="b2" id="photoBtn">▦ Прочитать с фото</button>
    <div class="status" id="status"></div>
    <div id="reader"></div>
    <label>Штрихкод:</label>
    <textarea id="bcText" readonly rows="2"></textarea>
  </div>

  <div class="card">
    <label>Materialnummer</label>
    <input id="material" placeholder="201486" autocomplete="off">
    <label>Name</label>
    <input id="name" placeholder="ELASTOSIL M 4601 A" autocomplete="off">
    <label>Charge</label>
    <input id="charge" placeholder="SR104689" autocomplete="off">
    <label>Gewicht (kg)</label>
    <input id="gewicht" placeholder="300.000" autocomplete="off">
    <button class="b3" id="saveBtn">💾 Сохранить запись</button>
  </div>

  <div class="card">
    <strong>Записи: <span id="cnt">0</span></strong>
    <div id="list" style="margin-top:8px"></div>
    <div class="row" style="margin-top:8px">
      <button class="b4" id="csvBtn">📤 CSV</button>
      <button class="b5" id="clrBtn">🗑 Очистить</button>
    </div>
  </div>

</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  var $ = function(id){return document.getElementById(id);};
  var records = [];
  try { records = JSON.parse(localStorage.getItem('rec') || '[]'); } catch(e){ records = []; }

  var CATALOG = {
    '201486': { name: 'ELASTOSIL M 4601 A', gewicht: '300.000' }
  };

  function setStatus(t){ $('status').textContent = t || ''; }

  function render(){
    $('cnt').textContent = records.length;
    var h = '';
    records.forEach(function(r,i){
      h += '<div class="rec"><div><b>'+(r.material||'—')+'</b> · '+(r.name||'—')+
           '<br><small>Charge: '+(r.charge||'—')+' · '+(r.gewicht||'—')+' kg</small></div>'+
           '<button class="del" data-i="'+i+'">×</button></div>';
    });
    $('list').innerHTML = h || '<div style="color:#999">Пока пусто</div>';
  }

  // Верхний штрихкод — валидный, нижний — нет
  function valid(raw){
    if(!raw) return false;
    var s = String(raw).trim();
    if(/^\d{9,}$/.test(s)) return false;   // нижний: только 10 цифр
    if(/^\d{4,10}\s*[\/\\-]\s*[A-Z]{1,4}\s*\d{5,10}$/i.test(s)) return true; // 00201486/SR104689
    if(/^[A-Z]{1,4}\d{5,10}$/i.test(s)) return true;   // SR104689
    if(/S[RB]?\s?\d{6,8}/i.test(s)) return true;
    return false;
  }

  function parse(raw){
    raw = String(raw).trim();
    var m = raw.match(/^(\d+)\s*[\/\\-]\s*([A-Z]{1,4}\s*\d{5,10})$/i);
    if(m){
      var mat = m[1].replace(/^0+/,'');
      if(mat.length !== 6){ var m6 = m[1].match(/(\d{6})$/); if(m6) mat = m6[1]; }
      $('material').value = mat;
      $('charge').value = m[2].replace(/\s/g,'').toUpperCase();
      if(CATALOG[mat]){
        if(!$('name').value) $('name').value = CATALOG[mat].name;
        if(!$('gewicht').value) $('gewicht').value = CATALOG[mat].gewicht;
      }
      return true;
    }
    m = raw.match(/^([A-Z]{1,4}\d{5,10})$/i);
    if(m){ $('charge').value = m[1].toUpperCase(); return true; }
    m = raw.match(/(\d{6})(?!\d)/);
    if(m){ $('material').value = m[1]; return true; }
    return false;
  }

  // ============ КАМЕРА ============
  $('scanBtn').onclick = function(){
    if(typeof Html5Qrcode === 'undefined'){ alert('Нет интернета'); return; }
    var r = $('reader');
    r.classList.add('on');
    var self = this;
    self.textContent = '⏹ Остановить';
    setStatus('Наведите на верхний штрихкод…');

    var qr = new Html5Qrcode('reader');
    qr.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},
      function(text){
        if(!valid(text)){
          setStatus('Это нижний. Наведите на верхний…');
          return;
        }
        setStatus('');
        $('bcText').value = text;
        parse(text);
        qr.stop().then(function(){ return qr.clear(); }).then(function(){
          r.classList.remove('on');
          self.textContent = '📹 Сканировать камерой';
        });
      },
      function(){});
  };

  // ============ ФОТО ============
  // Увеличиваем изображение и пробуем читать несколько раз
  function scaleImage(file, scale, cb){
    var img = new Image();
    img.onload = function(){
      var w = Math.round(img.width * scale);
      var h = Math.round(img.height * scale);
      if(Math.max(w,h) > 4000){
        var k = 4000/Math.max(w,h);
        w = Math.round(w*k); h = Math.round(h*k);
      }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(cb, 'image/png');
    };
    img.onerror = function(){ cb(null); };
    img.src = URL.createObjectURL(file);
  }

  function scanBlob(blob, onOk, onFail){
    var d = document.createElement('div');
    d.id = 'tmp' + Date.now() + Math.random();
    d.style.cssText = 'position:fixed;left:-9999px;width:400px;height:300px';
    document.body.appendChild(d);
    var qr = new Html5Qrcode(d.id, {verbose:false});
    var f;
    try { f = new File([blob], 's.png', {type:'image/png'}); } catch(e){ f = blob; }
    qr.scanFile(f, false).then(function(res){
      if(document.body.contains(d)) document.body.removeChild(d);
      onOk(res);
    }).catch(function(err){
      if(document.body.contains(d)) document.body.removeChild(d);
      onFail(err);
    });
  }

  $('photoBtn').onclick = function(){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function(){
      var f = inp.files[0]; if(!f) return;
      if(typeof Html5Qrcode === 'undefined'){ alert('Нет интернета'); return; }
      var btn = $('photoBtn');
      btn.disabled = true;
      setStatus('Ищу штрихкод…');

      // Пробуем масштабы по очереди: 1, 2, 3, 4
      var scales = [1, 2, 3, 4];
      var idx = 0;
      var ignored = [];

      function tryNext(){
        if(idx >= scales.length){
          setStatus('');
          btn.disabled = false;
          if(ignored.length){
            alert('Верхний штрихкод не найден.\n\nПрочитан нижний: ' + ignored[0] +
                  '\n\nПопробуйте сфотографировать верхний штрихкод крупнее или обрезать фото.');
          } else {
            alert('Штрихкод не найден. Сфотографируйте ближе, без бликов.');
          }
          return;
        }
        var scale = scales[idx++];
        setStatus('Попытка ' + idx + '/' + scales.length + ' (×' + scale + ')…');

        var runScan = function(blob){
          if(!blob){ tryNext(); return; }
          scanBlob(blob,
            function(res){
              if(valid(res)){
                // Нашли верхний!
                setStatus('');
                btn.disabled = false;
                $('bcText').value = res;
                parse(res);
                setStatus('✓ Прочитано: ' + res);
              } else {
                // Прочитан нижний — запоминаем и пробуем дальше
                ignored.push(res);
                tryNext();
              }
            },
            function(){ tryNext(); }
          );
        };

        if(scale === 1){ runScan(f); }
        else { scaleImage(f, scale, runScan); }
      }

      tryNext();
    };
    inp.click();
  };

  // ============ СОХРАНИТЬ ============
  $('saveBtn').onclick = function(){
    var r = {
      material: $('material').value.trim(),
      name: $('name').value.trim(),
      charge: $('charge').value.trim(),
      gewicht: $('gewicht').value.trim()
    };
    if(!r.material && !r.charge){ alert('Заполните поля'); return; }
    records.push(r);
    localStorage.setItem('rec', JSON.stringify(records));
    $('material').value = ''; $('name').value = '';
    $('charge').value = ''; $('gewicht').value = '';
    $('material').focus();
    render();
  };

  $('list').onclick = function(e){
    if(e.target.className === 'del'){
      records.splice(+e.target.dataset.i, 1);
      localStorage.setItem('rec', JSON.stringify(records));
      render();
    }
  };

  $('clrBtn').onclick = function(){
    if(!records.length) return;
    if(!confirm('Удалить все?')) return;
    records = [];
    localStorage.removeItem('rec');
    render();
  };

  $('csvBtn').onclick = function(){
    if(!records.length){ alert('Нет данных'); return; }
    var rows = ['Materialnummer;Name;Charge;Gewicht'];
    records.forEach(function(r){
      rows.push([r.material,r.name,r.charge,r.gewicht].join(';'));
    });
    var csv = '\uFEFF' + rows.join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'scan_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  };

  render();
})();
</script>
</body>
</html>
