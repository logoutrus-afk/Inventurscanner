<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d6efd">
<title>Etiketten Scanner</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:#f2f4f7;color:#1a1a1a;padding-bottom:90px}
  header{background:#0d6efd;color:#fff;padding:14px 16px;font-size:18px;font-weight:600;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .container{padding:14px;max-width:640px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  label{display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:500}
  input[type="text"],input[type="number"]{width:100%;padding:12px;font-size:16px;border:1px solid #d5d9e0;border-radius:8px;background:#fafbfc;outline:none;margin-bottom:12px}
  input:focus{border-color:#0d6efd;background:#fff}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:opacity .15s}
  button:active{opacity:.75} button:disabled{opacity:.5}
  .btn-ocr{background:#198754;color:#fff} .btn-gal{background:#20c997;color:#fff}
  .btn-scan{background:#0d6efd;color:#fff} .btn-save{background:#ffc107;color:#212529}
  .btn-export{background:#6f42c1;color:#fff} .btn-clear{background:#e9ecef;color:#495057;font-weight:500}
  .btn-row{display:flex;gap:8px} .btn-row button{margin-bottom:0}
  .counter{display:inline-block;background:#e7f1ff;color:#0d6efd;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}
  .record{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid #0d6efd}
  .record b{color:#0d6efd}
  .record .del{background:#dc3545;color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;padding:0;margin:0;flex-shrink:0}
  #reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;display:none}
  #reader.active{display:block}
  #preview{width:100%;border-radius:12px;margin-bottom:12px;display:none} #preview.active{display:block}
  #progress{display:none;text-align:center;padding:10px;color:#0d6efd;font-size:14px;background:#e7f1ff;border-radius:8px;margin-bottom:10px}
  #progress.active{display:block}
  #rawBox{display:none;margin-bottom:10px} #rawBox.active{display:block}
  #rawText{width:100%;min-height:140px;font-family:monospace;font-size:11px;padding:8px;border:1px solid #d5d9e0;border-radius:8px;background:#fafbfc;resize:vertical}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#212529;color:#fff;padding:12px 20px;border-radius:25px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .empty{text-align:center;color:#999;padding:20px;font-size:14px}
  .tips{font-size:12px;color:#666;background:#fff8e1;padding:10px;border-radius:8px;margin-bottom:10px;border-left:3px solid #ffc107}
</style>
</head>
<body>

<header>📦 Etiketten Scanner</header>

<div class="container">

  <div class="card">
    <div class="tips">💡 Снимайте этикетку прямо, без бликов.</div>

    <button class="btn-ocr" id="btnOcrCamera">📷 Фото с камеры → распознать</button>
    <button class="btn-gal" id="btnOcrGallery">🖼 Выбрать фото из галереи</button>
    <button class="btn-scan" id="btnScan">▦ Сканировать штрихкод (Charge)</button>

    <div id="reader"></div>
    <img id="preview" alt="">
    <div id="progress">Распознаю…</div>

    <div id="rawBox">
      <label>Распознанный текст (для проверки):</label>
      <textarea id="rawText" readonly></textarea>
    </div>

    <label>Materialnummer</label>
    <input type="text" id="material" inputmode="numeric" placeholder="201486">

    <label>Name</label>
    <input type="text" id="name" placeholder="ELASTOSIL M 4601 A">

    <label>Charge</label>
    <input type="text" id="charge" placeholder="SR104689">

    <label>Gewicht (kg)</label>
    <input type="number" id="gewicht" step="0.001" placeholder="300.000">

    <button class="btn-save" id="btnSave">💾 Сохранить запись</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong>Записи</strong><span class="counter" id="counter">0</span>
    </div>
    <div id="list"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn-export" id="btnExport">📤 CSV</button>
      <button class="btn-clear" id="btnClear">🗑 Очистить</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = 'etiketten_records', NAME_KEY = 'etiketten_last_name';
  let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let html5Qr = null, scanning = false;

  $('name').value = localStorage.getItem(NAME_KEY) || '';

  let toastTimer;
  function toast(msg, ms=2500){
    const t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ms);
  }
  function render(){
    const list=$('list'); $('counter').textContent=records.length;
    if(!records.length){list.innerHTML='<div class="empty">Пока пусто.</div>';return;}
    list.innerHTML=records.map((r,i)=>`
      <div class="record">
        <div>
          <div><b>${esc(r.material||'—')}</b> · ${esc(r.name||'—')}</div>
          <div style="font-size:12px;color:#666;margin-top:2px">Charge: ${esc(r.charge||'—')} · ${esc(r.gewicht||'—')} kg</div>
        </div>
        <button class="del" data-i="${i}">×</button>
      </div>`).join('');
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  $('btnSave').addEventListener('click', () => {
    const material=$('material').value.trim(), name=$('name').value.trim(),
          charge=$('charge').value.trim(), gewicht=$('gewicht').value.trim();
    if(!material && !charge){toast('Заполните Materialnummer или Charge');return;}
    if(name) localStorage.setItem(NAME_KEY, name);
    records.push({material,name,charge,gewicht});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    render();
    $('material').value='';$('charge').value='';$('gewicht').value='';$('material').focus();
    toast('Сохранено ✓');
  });
  $('list').addEventListener('click', e => {
    if(e.target.classList.contains('del')){
      records.splice(+e.target.dataset.i,1);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); render();
    }
  });
  $('btnClear').addEventListener('click', () => {
    if(!records.length || !confirm('Удалить все записи?')) return;
    records=[]; localStorage.removeItem(STORAGE_KEY); render(); toast('Удалено');
  });

  $('btnExport').addEventListener('click', () => {
    if(!records.length){toast('Нет данных');return;}
    const rows=['Materialnummer;Name;Charge;Gewicht'];
    records.forEach(r=>{
      rows.push([r.material,r.name,r.charge,r.gewicht].map(v=>{
        v=String(v??''); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
      }).join(';'));
    });
    const csv='\uFEFF'+rows.join('\n');
    const filename='scan_export_'+new Date().toISOString().slice(0,10)+'.csv';
    try{
      const file=new File([csv],filename,{type:'text/csv'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Scan Export'}).catch(()=>downloadFallback(csv,filename));
        return;
      }
    }catch(e){}
    downloadFallback(csv,filename);
  });
  function downloadFallback(csv,filename){
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),3000); toast('Файл сохранён');
  }

  // ---------- Штрихкод ----------
  $('btnScan').addEventListener('click', async () => {
    if(scanning){await stopScan();return;}
    const reader=$('reader'); reader.classList.add('active');
    $('btnScan').textContent='⏹ Остановить';
    try{
      html5Qr=new Html5Qrcode('reader');
      await html5Qr.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:160}},
        (text)=>{ $('charge').value=text; if(navigator.vibrate)navigator.vibrate(60); toast('Штрихкод: '+text); stopScan(); },()=>{});
      scanning=true;
    }catch(e){ alert('Ошибка камеры: '+(e.message||e)); stopScan(); }
  });
  async function stopScan(){
    scanning=false;
    if(html5Qr){try{await html5Qr.stop();await html5Qr.clear();}catch(e){} html5Qr=null;}
    $('reader').classList.remove('active');
    $('btnScan').textContent='▦ Сканировать штрихкод (Charge)';
  }

  // ============================================================
  //  Bold-фильтр (морфологический)
  // ============================================================
  function boldFilter(imageData, w, h, iterations) {
    const d = imageData.data;
    const size = w * h;
    let src = new Uint8ClampedArray(size);
    let dst = new Uint8ClampedArray(size);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) src[j] = d[i];

    for (let it = 0; it < iterations; it++) {
      for (let y = 0; y < h; y++) {
        const yOff = y * w;
        for (let x = 0; x < w; x++) {
          let maxV = 0;
          for (let dy = -1; dy <= 1; dy++) {
            const ny = y + dy; if (ny < 0 || ny >= h) continue;
            const rOff = ny * w;
            for (let dx = -1; dx <= 1; dx++) {
              const nx = x + dx; if (nx < 0 || nx >= w) continue;
              const v = src[rOff + nx]; if (v > maxV) maxV = v;
            }
          }
          dst[yOff + x] = maxV;
        }
      }
      const tmp = src; src = dst; dst = tmp;
    }
    for (let it = 0; it < iterations; it++) {
      for (let y = 0; y < h; y++) {
        const yOff = y * w;
        for (let x = 0; x < w; x++) {
          let minV = 255;
          for (let dy = -1; dy <= 1; dy++) {
            const ny = y + dy; if (ny < 0 || ny >= h) continue;
            const rOff = ny * w;
            for (let dx = -1; dx <= 1; dx++) {
              const nx = x + dx; if (nx < 0 || nx >= w) continue;
              const v = src[rOff + nx]; if (v < minV) minV = v;
            }
          }
          dst[yOff + x] = minV;
        }
      }
      const tmp = src; src = dst; dst = tmp;
    }
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      d[i] = d[i+1] = d[i+2] = src[j];
    }
    return imageData;
  }

  function preprocessImage(file, opts = {}) {
    const upscale   = opts.upscale   || 2;
    const cropFrom  = opts.cropFrom  ?? 0;
    const cropTo    = opts.cropTo    ?? 1;
    const contrast  = opts.contrast  ?? 1.6;
    const bold      = opts.bold      ?? 0;
    const mode      = opts.mode      || 'gray';

    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const srcY = Math.floor(img.height * cropFrom);
        const srcH = Math.floor(img.height * (cropTo - cropFrom));
        const srcW = img.width;
        const w = Math.round(srcW * upscale);
        const h = Math.round(srcH * upscale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, srcY, srcW, srcH, 0, 0, w, h);

        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        const N = w * h;

        for (let i = 0; i < d.length; i += 4) {
          let g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          g = (g - 128) * contrast + 128;
          g = Math.max(0, Math.min(255, g));
          d[i] = d[i+1] = d[i+2] = g;
        }

        if (mode === 'otsu') {
          const hist = new Array(256).fill(0);
          for (let i = 0; i < d.length; i += 4) hist[d[i]]++;
          let total = N, sum = 0;
          for (let i = 0; i < 256; i++) sum += i * hist[i];
          let sumB = 0, wB = 0, maxVar = 0, thr = 128;
          for (let t = 0; t < 256; t++) {
            wB += hist[t]; if (!wB) continue;
            const wF = total - wB; if (!wF) break;
            sumB += t * hist[t];
            const mB = sumB / wB, mF = (sum - sumB) / wF;
            const between = wB * wF * (mB - mF) * (mB - mF);
            if (between > maxVar) { maxVar = between; thr = t; }
          }
          for (let i = 0; i < d.length; i += 4) {
            const v = d[i] > thr ? 255 : 0;
            d[i] = d[i+1] = d[i+2] = v;
          }
        }

        if (bold > 0) boldFilter(imgData, w, h, bold);

        ctx.putImageData(imgData, 0, 0);
        canvas.toBlob(resolve, 'image/png');
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function ocrImage(blob, psm, onProgress, extraParams) {
    const worker = await Tesseract.createWorker('deu', 1, {
      logger: onProgress || (()=>{}),
      errorHandler: e => console.warn('Tesseract:', e)
    });
    const params = {
      tessedit_pageseg_mode: String(psm || 6),
      preserve_interword_spaces: '1'
    };
    if (extraParams) Object.assign(params, extraParams);
    await worker.setParameters(params);
    const { data } = await worker.recognize(blob);
    await worker.terminate();
    return (data && data.text) || '';
  }

  // ============================================================
  //  ГЛАВНЫЙ ПАЙПЛАЙН
  // ============================================================
  async function runOcr(file) {
    if (!file) return;

    $('preview').src = URL.createObjectURL(file);
    $('preview').classList.add('active');
    $('progress').classList.add('active');
    $('btnOcrCamera').disabled = true;
    $('btnOcrGallery').disabled = true;

    try {
      const variants = [];

      // 1) full-gray — общий контекст
      $('progress').textContent = 'Проход 1/4…';
      const v1 = await preprocessImage(file, { upscale:2, contrast:1.5, mode:'gray' });
      variants.push({ name:'full-gray', text: await ocrImage(v1, 6, m => {
        if (m.status==='recognizing text') $('progress').textContent = 'Проход 1/4… '+Math.round((m.progress||0)*100)+'%';
      })});

      // 2) bold-full — жирный текст
      $('progress').textContent = 'Проход 2/4 (жирный)…';
      const v2 = await preprocessImage(file, { upscale:2, contrast:1.7, bold:2, mode:'otsu' });
      variants.push({ name:'bold-full', text: await ocrImage(v2, 6, m => {
        if (m.status==='recognizing text') $('progress').textContent = 'Проход 2/4… '+Math.round((m.progress||0)*100)+'%';
      })});

      // 3) topDigits — верх 15% этикетки, ×5, PSM 7, whitelist digits
      $('progress').textContent = 'Проход 3/4 (цифры вверху)…';
      const v3blob = await preprocessImage(file, { upscale:5, contrast:1.6, cropFrom:0, cropTo:0.15, mode:'gray' });
      const v3text = await ocrImage(v3blob, 7, m => {
        if (m.status==='recognizing text') $('progress').textContent = 'Проход 3/4… '+Math.round((m.progress||0)*100)+'%';
      }, { tessedit_char_whitelist: '0123456789 ' });
      variants.push({ name:'topDigits', text: v3text });

      // 4) nameStrip — верхние 40%, для Name
      $('progress').textContent = 'Проход 4/4 (Name)…';
      const v4blob = await preprocessImage(file, { upscale:3, contrast:1.7, bold:1, cropFrom:0.1, cropTo:0.4, mode:'otsu' });
      const v4text = await ocrImage(v4blob, 6, m => {
        if (m.status==='recognizing text') $('progress').textContent = 'Проход 4/4… '+Math.round((m.progress||0)*100)+'%';
      });
      variants.push({ name:'nameStrip', text: v4text });

      let allText = '';
      variants.forEach(v => { allText += `\n===== ${v.name} =====\n${v.text}\n`; });
      $('rawText').value = allText;
      $('rawBox').classList.add('active');
      console.log('=== RAW OCR ===' + allText);

      const filled = { material:false, name:false, charge:false, gewicht:false };

      // ===== Materialnummer =====
      // Сначала dedicated-проход
      const numFromTop = extract6Digits(v3text);
      if (numFromTop) {
        $('material').value = numFromTop;
        filled.material = true;
        console.log('Material (topDigits):', numFromTop);
      }
      // Потом обычный парсер по остальным проходам
      if (!filled.material) {
        for (const v of variants) {
          const m = extractMaterial(v.text);
          if (m) { $('material').value = m; filled.material = true; console.log('Material ('+v.name+'):', m); break; }
        }
      }

      // ===== Name =====
      if (!filled.name) {
        // Ищем по всем проходам
        for (const v of variants) {
          const lines = v.text.split('\n').map(s=>s.trim()).filter(Boolean);
          for (const ln of lines) {
            if (/[®©Ⓡ]/.test(ln) && ln.replace(/[®©Ⓡ]/g,'').trim().length > 4) {
              let nm = ln.replace(/[®©Ⓡ]/g,'').replace(/\s+/g,' ').trim();
              nm = nm.replace(/^[^A-Z]+/, '');  // убираем мусор в начале
              if (nm.length >= 3) { $('name').value = nm; filled.name = true; break; }
            }
          }
          if (filled.name) break;
        }
        // Фолбэк — ищем бренд
        if (!filled.name) {
          const brands = /\b(ELASTOSIL|WACKER|SILICONE|TEROSON|LOCTITE|SIKA|DOW|HENKEL|MOMENTIVE)\b/i;
          for (const v of variants) {
            const lines = v.text.split('\n').map(s=>s.trim()).filter(Boolean);
            for (const ln of lines) {
              if (brands.test(ln)) {
                let nm = ln.replace(/[®©Ⓡ"']/g,'').replace(/\s+/g,' ').trim();
                nm = nm.replace(/^[^A-Z]+/, '');
                if (nm.length >= 3) { $('name').value = nm; filled.name = true; break; }
              }
            }
            if (filled.name) break;
          }
        }
      }

      // ===== Charge (почистить от $ и пробелов) =====
      if (!filled.charge) {
        const charge = extractCharge(variants.map(v=>v.text).join('\n'));
        if (charge) { $('charge').value = charge; filled.charge = true; }
      }

      // ===== Gewicht =====
      if (!filled.gewicht) {
        const gew = extractGewicht(variants.map(v=>v.text).join('\n'));
        if (gew) { $('gewicht').value = gew; filled.gewicht = true; }
      }

      const count = Object.values(filled).filter(Boolean).length;
      if (count === 0) toast('Не распознано — попробуйте фото лучше', 4000);
      else toast('Заполнено полей: ' + count + ' ✓');
    } catch (e) {
      console.error(e);
      alert('Ошибка OCR: ' + (e.message || e));
    } finally {
      $('progress').classList.remove('active');
      $('btnOcrCamera').disabled = false;
      $('btnOcrGallery').disabled = false;
    }
  }

  $('btnOcrCamera').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.capture='environment';
    inp.onchange = () => runOcr(inp.files && inp.files[0]);
    inp.click();
  });
  $('btnOcrGallery').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*';
    inp.onchange = () => runOcr(inp.files && inp.files[0]);
    inp.click();
  });

  // ============================================================
  //  Извлечение полей
  // ============================================================
  function extract6Digits(text) {
    if (!text) return '';
    // Ищем 6 цифр, стоящие отдельным токеном
    const m = text.match(/(?:^|\D)(\d{6})(?!\d)/);
    return m ? m[1] : '';
  }

  function extractMaterial(text) {
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
    const packRe = /P\s*[AА]\s*C\s*[KК]\s*[\s\-_\.]*S\s*T\s*[UÜUО]\s*C\s*[KК]/i;

    let packIdx = -1;
    for (let i = 0; i < lines.length; i++) {
      if (packRe.test(lines[i])) { packIdx = i; break; }
    }
    if (packIdx >= 0) {
      const candidates = [];
      for (let off = 1; off <= 3; off++) {
        for (const dir of [-1, 1]) {
          const i = packIdx + dir * off;
          if (i < 0 || i >= lines.length) continue;
          const m = lines[i].match(/(?:^|[^\d])(\d{6})(?!\d)/);
          if (m) candidates.push({ value: m[1], dist: off });
        }
      }
      if (candidates.length) {
        candidates.sort((a,b) => a.dist - b.dist);
        return candidates[0].value;
      }
    }
    // Фолбэк: 6 цифр в любой строке
    const m = text.match(/(?:^|\D)(\d{6})(?!\d)/);
    return m ? m[1] : '';
  }

  function extractCharge(text) {
    // CHARGEN NR. S$R1 04689  → SR104689
    // Ищем контекст CHARGEN
    const ctx = text.match(/CHARGEN?[\s\S]{0,30}?([A-Z$S]{2,4}[\s]?\d[\d\s]{4,10})/i);
    if (ctx) {
      let s = ctx[1]
        .replace(/\$/g, 'S')     // $ → S (типичная OCR-ошибка)
        .replace(/[^A-Z0-9]/gi, '')  // убираем всё кроме букв/цифр
        .toUpperCase();
      // Ищем шаблон SRxxxxxx
      const m = s.match(/S[RB](\d{5,8})/);
      if (m) return 'SR' + m[1];
      if (s.length >= 6 && s.length <= 12) return s;
    }
    // Фолбэк: SRxxxxxx где угодно
    const m = text.toUpperCase().match(/\bS[RB]\s?(\d{6,8})\b/);
    if (m) return 'SR' + m[1];
    return '';
  }

  function extractGewicht(text) {
    const up = text.toUpperCase();
    // NETTO 300,000 KG
    const netto = up.match(/NETTO[^\d]{0,15}(\d+[.,]\d+)\s*(KG|G)?/);
    if (netto) {
      let g = netto[1].replace(',', '.');
      if (netto[2] === 'G') g = (parseFloat(g)/1000).toFixed(3);
      return g;
    }
    // 300,000 KG
    const g2 = up.match(/(\d+[.,]\d{2,3})\s*KG/);
    if (g2) return g2[1].replace(',', '.');
    return '';
  }

  render();
})();
</script>
