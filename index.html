<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест JS v3</title>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #f2f4f7;">

<h1 style="color: #0d6efd;">Тест JavaScript v3</h1>

<p id="ver" style="padding: 12px; background: #fff3cd; border-radius: 8px; font-size: 14px;">
  ⏳ Проверка версии...
</p>

<p id="out" style="padding: 12px; background: #ffe6e6; border-radius: 8px; font-size: 15px;">
  ⏳ Скрипт ещё не выполнялся
</p>

<button onclick="alert('Кнопка 1 работает!')"
        style="display:block;width:100%;padding:18px;font-size:17px;margin-bottom:10px;background:#0d6efd;color:#fff;border:none;border-radius:10px;">
  Кнопка 1 (onclick)
</button>

<button id="b2"
        style="display:block;width:100%;padding:18px;font-size:17px;background:#198754;color:#fff;border:none;border-radius:10px;">
  Кнопка 2 (addEventListener)
</button>

<script>
  // Показываем версию файла — чтобы точно знать, что GitHub отдаёт новый
  document.getElementById('ver').textContent =
    '📄 Версия файла: v3 | Загружено: ' + new Date().toLocaleString('ru-RU');

  // Проверка выполнения JS
  document.getElementById('out').textContent = '✅ JS РАБОТАЕТ в вашем приложении!';
  document.getElementById('out').style.background = '#d4edda';

  // Обработчик через addEventListener
  document.getElementById('b2').addEventListener('click', function () {
    alert('Кнопка 2 работает!');
  });

  // Ловим ошибки
  window.onerror = function(msg, url, line) {
    document.getElementById('out').textContent = '❌ Ошибка: ' + msg + ' (строка ' + line + ')';
    document.getElementById('out').style.background = '#f8d7da';
  };
</script>

</body>
</html>
