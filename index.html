<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d6efd">
<title>Etiketten Scanner</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:#f2f4f7;color:#1a1a1a;padding-bottom:90px}
  header{background:#0d6efd;color:#fff;padding:14px 16px;font-size:18px;font-weight:600;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .container{padding:14px;max-width:640px;margin:0 auto}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  label{display:block;font-size:13px;color:#555;margin-bottom:4px;font-weight:500}
  input[type="text"],input[type="number"]{width:100%;padding:12px;font-size:16px;border:1px solid #d5d9e0;border-radius:8px;background:#fafbfc;outline:none;margin-bottom:12px}
  input:focus{border-color:#0d6efd;background:#fff}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:opacity .15s}
  button:active{opacity:.75} button:disabled{opacity:.5}
  .btn-ocr{background:#198754;color:#fff} .btn-gal{background:#20c997;color:#fff}
  .btn-scan{background:#0d6efd;color:#fff} .btn-save{background:#ffc107;color:#212529}
  .btn-barcode-photo{background:#fd7e14;color:#fff}
  .btn-export{background:#6f42c1;color:#fff} .btn-clear{background:#e9ecef;color:#495057;font-weight:500}
  .btn-row{display:flex;gap:8px} .btn-row button{margin-bottom:0}
  .counter{display:inline-block;background:#e7f1ff;color:#0d6efd;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}
  .record{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid #0d6efd}
  .record b{color:#0d6efd}
  .record .del{background:#dc3545;color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;padding:0;margin:0;flex-shrink:0}
  #reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;display:none}
  #reader.active{display:block}
  #preview{width:100%;border-radius:12px;margin-bottom:12px;display:none} #preview.active{display:block}
  #progress{display:none;text-align:center;padding:10px;color:#0d6efd;font-size:14px;background:#e7f1ff;border-radius:8px;margin-bottom:10px}
  #progress.active{display:block}
  #rawBox{display:none;margin-bottom:10px} #rawBox.active{display:block}
  #rawText{width:100%;min-height:140px;font-family:monospace;font-size:11px;padding:8px;border:1px solid #d5d9e0;border-radius:8px;background:#fafbfc;resize:vertical}
  #bcBox{display:none;margin-bottom:10px;background:#fff8e1;border-left:3px solid #fd7e14;padding:10px;border-radius:8px}
  #bcBox.active{display:block}
  #bcText{width:100%;min-height:60px;font-family:monospace;font-size:13px;padding:8px;border:1px solid #ffc107;border-radius:8px;background:#fff;resize:vertical}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#212529;color:#fff;padding:12px 20px;border-radius:25px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .empty{text-align:center;color:#999;padding:20px;font-size:14px}
  .tips{font-size:12px;color:#666;background:#fff8e1;padding:10px;border-radius:8px;margin-bottom:10px;border-left:3px solid #ffc107}
  #jsError{display:none;background:#dc3545;color:#fff;padding:12px;border-radius:8px;margin-bottom:14px;font-size:13px;word-break:break-word}
</style>
</head>
<body>

<header>📦 Etiketten Scanner</header>

<div class="container">

  <div id="jsError"></div>

  <div class="card">
    <div class="tips">💡 Наведите камеру на штрихкод — все поля заполнятся автоматически.</div>

    <button class="btn-scan" id="btnScan">📹 Сканировать штрихкод камерой</button>
    <button class="btn-barcode-photo" id="btnBarcodeFromPhoto">▦ Прочитать штрихкод с фото</button>
    <button class="btn-ocr" id="btnOcrCamera">📷 OCR с камеры (если штрихкод не читается)</button>
    <button class="btn-gal" id="btnOcrGallery">🖼 OCR из галереи</button>

    <div id="reader"></div>
    <img id="preview" alt="">
    <div id="progress">Обрабатываю…</div>

    <div id="bcBox">
      <label>📊 Содержимое штрихкода:</label>
      <textarea id="bcText" readonly></textarea>
    </div>

    <div id="rawBox">
      <label>OCR текст:</label>
      <textarea id="rawText" readonly></textarea>
    </div>

    <label>Materialnummer</label>
    <input type="text" id="material" inputmode="numeric" placeholder="201486">

    <label>Name</label>
    <input type="text" id="name" placeholder="ELASTOSIL M 4601 A">

    <label>Charge</label>
    <input type="text" id="charge" placeholder="SR104689">

    <label>Gewicht (kg)</label>
    <input type="number" id="gewicht" step="0.001" placeholder="300.000">

    <button class="btn-save" id="btnSave">💾 Сохранить запись</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong>Записи</strong><span class="counter" id="counter">0</span>
    </div>
    <div id="list"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn-export" id="btnExport">📤 CSV</button>
      <button class="btn-clear" id="btnClear">🗑 Очистить</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Скрипты с onerror — если CDN не загрузится, мы увидим -->
<script>
  window.__errors = [];
  window.addEventListener('error', function(e) {
    var msg = e.message || (e.error && e.error.message) || 'Неизвестная ошибка';
    window.__errors.push(msg);
    var box = document.getElementById('jsError');
    if (box) {
      box.style.display = 'block';
      box.textContent = '⚠ Ошибка: ' + msg;
    }
    console.error('JS Error:', e);
  });
</script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="alert('Не загрузился html5-qrcode. Проверьте интернет.')"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" onerror="alert('Не загрузился Tesseract. Проверьте интернет.')"></script>

<script>
// ============================================================
//  Безопасная инициализация
// ============================================================
(function () {
  'use strict';

  // --- Безопасные хелперы ---
  function $(id) { return document.getElementById(id); }

  function on(id, evt, handler) {
    var el = document.getElementById(id);
    if (!el) {
      console.warn('Element not found, skipping handler:', id);
      return null;
    }
    el.addEventListener(evt, handler);
    return el;
  }

  function setVal(id, val) {
    var el = document.getElementById(id);
    if (el) el.value = val;
  }
  function getVal(id) {
    var el = document.getElementById(id);
    return el ? el.value : '';
  }
  function show(id) {
    var el = document.getElementById(id);
    if (el) el.classList.add('active');
  }
  function showBlock(id) {
    var el = document.getElementById(id);
    if (el) el.style.display = 'block';
  }

  // --- Состояние ---
  var records = [];
  try {
    records = JSON.parse(localStorage.getItem('etiketten_records') || '[]');
  } catch (e) {
    records = [];
  }

  var html5Qr = null;
  var scanning = false;

  // --- Справочник продуктов ---
  // Добавьте сюда свои продукты: Materialnummer → { name, gewicht }
  var CATALOG = {
    '201486': { name: 'ELASTOSIL M 4601 A', gewicht: '300.000' }
    // '305123': { name: '...', gewicht: '25.000' },
  };

  // --- Восстановление имени ---
  var savedName = localStorage.getItem('etiketten_last_name') || '';
  setVal('name', savedName);

  // --- Toast ---
  var toastTimer;
  function toast(msg, ms) {
    ms = ms || 2500;
    var t = $('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, ms);
  }

  // --- Экранирование ---
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // --- Отрисовка списка записей ---
  function render() {
    var list = $('list');
    var counter = $('counter');
    if (!list) return;
    if (counter) counter.textContent = records.length;
    if (!records.length) {
      list.innerHTML = '<div class="empty">Пока пусто.</div>';
      return;
    }
    list.innerHTML = records.map(function(r, i){
      return '<div class="record">' +
        '<div>' +
          '<div><b>' + esc(r.material || '—') + '</b> · ' + esc(r.name || '—') + '</div>' +
          '<div style="font-size:12px;color:#666;margin-top:2px">' +
            'Charge: ' + esc(r.charge || '—') + ' · ' + esc(r.gewicht || '—') + ' kg' +
          '</div>' +
        '</div>' +
        '<button class="del" data-i="' + i + '">×</button>' +
      '</div>';
    }).join('');
  }

  // ============================================================
  //  СОХРАНЕНИЕ
  // ============================================================
  on('btnSave', 'click', function () {
    var material = getVal('material').trim();
    var name = getVal('name').trim();
    var charge = getVal('charge').trim();
    var gewicht = getVal('gewicht').trim();

    if (!material && !charge) { toast('Заполните Materialnummer или Charge'); return; }
    if (name) localStorage.setItem('etiketten_last_name', name);

    records.push({ material: material, name: name, charge: charge, gewicht: gewicht });
    localStorage.setItem('etiketten_records', JSON.stringify(records));
    render();

    setVal('material', '');
    setVal('charge', '');
    setVal('gewicht', '');
    var matEl = $('material');
    if (matEl) matEl.focus();
    toast('Сохранено ✓');
  });

  on('list', 'click', function (e) {
    var target = e.target;
    if (target && target.classList && target.classList.contains('del')) {
      var idx = parseInt(target.dataset.i, 10);
      if (!isNaN(idx)) {
        records.splice(idx, 1);
        localStorage.setItem('etiketten_records', JSON.stringify(records));
        render();
      }
    }
  });

  on('btnClear', 'click', function () {
    if (!records.length) return;
    if (!confirm('Удалить все записи?')) return;
    records = [];
    localStorage.removeItem('etiketten_records');
    render();
    toast('Удалено');
  });

  // ============================================================
  //  CSV
  // ============================================================
  on('btnExport', 'click', function () {
    if (!records.length) { toast('Нет данных'); return; }
    var rows = ['Materialnummer;Name;Charge;Gewicht'];
    records.forEach(function (r) {
      rows.push([r.material, r.name, r.charge, r.gewicht].map(function (v) {
        v = String(v == null ? '' : v);
        return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(';'));
    });
    var csv = '\uFEFF' + rows.join('\n');
    var filename = 'scan_export_' + new Date().toISOString().slice(0, 10) + '.csv';

    try {
      var file = new File([csv], filename, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Scan Export' })
          .catch(function () { downloadFallback(csv, filename); });
        return;
      }
    } catch (e) {}

    downloadFallback(csv, filename);
  });

  function downloadFallback(csv, filename) {
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast('Файл сохранён');
  }

  // ============================================================
  //  ШТРИХКОД С ФОТО
  // ============================================================
  on('btnBarcodeFromPhoto', 'click', function () {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = function () {
      var file = inp.files && inp.files[0];
      if (file) scanBarcodeFromImage(file);
    };
    inp.click();
  });

  function scanBarcodeFromImage(file) {
    var preview = $('preview');
    if (preview) {
      preview.src = URL.createObjectURL(file);
      preview.classList.add('active');
    }
    var prog = $('progress');
    if (prog) {
      prog.classList.add('active');
      prog.textContent = 'Ищу штрихкод на фото…';
    }
    var btn = $('btnBarcodeFromPhoto');
    if (btn) btn.disabled = true;

    // Создаём временный контейнер (вне экрана) — чтобы точно был виден для html5-qrcode
    var tempDiv = document.createElement('div');
    tempDiv.id = 'reader-temp-' + Date.now();
    tempDiv.style.position = 'fixed';
    tempDiv.style.left = '-10000px';
    tempDiv.style.top = '0';
    tempDiv.style.width = '300px';
    tempDiv.style.height = '200px';
    document.body.appendChild(tempDiv);

    try {
      var scanner = new Html5Qrcode(tempDiv.id, { verbose: false });

      scanner.scanFile(file, false)
        .then(function (result) {
          var bct = $('bcText');
          if (bct) bct.value = result;
          show('bcBox');
          parseBarcode(result);
          toast('Штрихкод прочитан ✓');
        })
        .catch(function (err) {
          console.error('scanFile error:', err);
          var bct = $('bcText');
          if (bct) bct.value = 'Не удалось прочитать: ' + (err && err.message ? err.message : err);
          show('bcBox');
          toast('Штрихкод не найден на фото', 3500);
        })
        .finally(function () {
          if (prog) prog.classList.remove('active');
          if (btn) btn.disabled = false;
          if (tempDiv.parentNode) tempDiv.parentNode.removeChild(tempDiv);
        });
    } catch (e) {
      console.error('scanner creation error:', e);
      alert('Ошибка запуска сканера: ' + (e.message || e));
      if (prog) prog.classList.remove('active');
      if (btn) btn.disabled = false;
      if (tempDiv.parentNode) tempDiv.parentNode.removeChild(tempDiv);
    }
  }

  // ============================================================
  //  ПАРСЕР ШТРИХКОДА
  // ============================================================
  function parseBarcode(raw) {
    if (!raw) return;
    raw = String(raw).trim();

    var bct = $('bcText');
    if (bct) bct.value = raw;
    show('bcBox');

    // Формат 1: 00NNNNNN/SRxxxxxx
    var m = raw.match(/^(\d+)\s*[\/\\\-]\s*([A-Z]{1,4}\s*\d{5,10})$/i);
    if (m) {
      fillFromCustomFormat(m[1], m[2]);
      return;
    }

    // Формат 2: только SRxxxxxx
    m = raw.match(/^([A-Z]{1,4}\d{5,10})$/i);
    if (m) {
      setVal('charge', m[1].toUpperCase());
      toast('Только Charge — остальное введите вручную');
      return;
    }

    // Формат 3: GS1-128
    if (parseGS1(raw)) return;

    // Формат 4: что-нибудь найдём
    var sr = raw.toUpperCase().match(/S[RB]?\s?(\d{6,8})/);
    if (sr) setVal('charge', 'SR' + sr[1]);

    var m6 = raw.match(/(?:^|[^\d])(\d{6})(?!\d)/);
    if (m6) {
      setVal('material', m6[1]);
      fillFromCatalog(m6[1]);
    }

    toast('Разобрано частично');
  }

  function fillFromCustomFormat(matRaw, chargeRaw) {
    var material = matRaw.replace(/^0+/, '');
    if (material.length !== 6) {
      var m6 = matRaw.match(/(\d{6})$/);
      if (m6) material = m6[1];
    }
    var charge = chargeRaw.replace(/\s/g, '').toUpperCase();

    setVal('material', material);
    setVal('charge', charge);
    fillFromCatalog(material);
    toast('Штрихкод разобран ✓');
  }

  function fillFromCatalog(material) {
    if (!material) return;
    var entry = CATALOG[material];
    if (!entry) return;
    if (entry.name && !getVal('name').trim()) setVal('name', entry.name);
    if (entry.gewicht && !getVal('gewicht').trim()) setVal('gewicht', entry.gewicht);
  }

  function parseGS1(raw) {
    var s = raw
      .replace(/\x1D/g, '|')
      .replace(/<GS>/gi, '|')
      .replace(/\((\d{2,4})\)/g, '|$1|')
      .replace(/\s+/g, ' ');

    if (!/\|?\d{2,4}[|\s]/.test(s)) return false;

    var result = {};
    var m;

    m = s.match(/(?:^|\|)01[|\s]?(\d{14})/);
    if (m) result.gtin = m[1];

    m = s.match(/(?:^|\|)10[|\s]?([^|\s]{1,20})/);
    if (m) result.charge = m[1].toUpperCase();

    m = s.match(/(?:^|\|)3103[|\s]?(\d{6})/);
    if (m) result.gewicht = (parseInt(m[1], 10) / 1000).toFixed(3);

    m = s.match(/(?:^|\|)3102[|\s]?(\d{5})/);
    if (m && !result.gewicht) result.gewicht = (parseInt(m[1], 10) / 100).toFixed(3);

    if (!result.charge && !result.gtin && !result.gewicht) return false;

    if (result.gtin) {
      var mat = result.gtin.replace(/^0+/, '');
      var m6 = mat.match(/(\d{6})$/);
      if (m6) {
        setVal('material', m6[1]);
        fillFromCatalog(m6[1]);
      }
    }
    if (result.charge && !getVal('charge')) {
      setVal('charge', 'SR' + result.charge.replace(/^SR/i, ''));
    }
    if (result.gewicht && !getVal('gewicht')) setVal('gewicht', result.gewicht);

    toast('GS1-128 разобран ✓');
    return true;
  }

  // ============================================================
  //  КАМЕРНЫЙ ШТРИХКОД
  // ============================================================
  on('btnScan', 'click', function () {
    if (scanning) { stopScan(); return; }
    var reader = $('reader');
    var btn = $('btnScan');
    if (!reader || !btn) return;

    reader.classList.add('active');
    btn.textContent = '⏹ Остановить';

    try {
      html5Qr = new Html5Qrcode('reader');
      html5Qr.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 300, height: 180 } },
        function (text) {
          var bct = $('bcText');
          if (bct) bct.value = text;
          show('bcBox');
          parseBarcode(text);
          if (navigator.vibrate) navigator.vibrate(80);
          stopScan();
        },
        function () {}
      ).then(function () {
        scanning = true;
      }).catch(function (e) {
        alert('Ошибка камеры: ' + (e.message || e));
        stopScan();
      });
    } catch (e) {
      alert('Ошибка запуска: ' + (e.message || e));
      stopScan();
    }
  });

  function stopScan() {
    scanning = false;
    if (html5Qr) {
      html5Qr.stop().then(function () {
        return html5Qr.clear();
      }).catch(function () {}).finally(function () {
        html5Qr = null;
      });
    }
    var reader = $('reader');
    if (reader) reader.classList.remove('active');
    var btn = $('btnScan');
    if (btn) btn.textContent = '📹 Сканировать штрихкод камерой';
  }

  // ============================================================
  //  OCR (упрощённый — если штрихкод не читается)
  // ============================================================
  on('btnOcrCamera', 'click', function () {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.capture = 'environment';
    inp.onchange = function () {
      if (inp.files && inp.files[0]) runOcr(inp.files[0]);
    };
    inp.click();
  });

  on('btnOcrGallery', 'click', function () {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = function () {
      if (inp.files && inp.files[0]) runOcr(inp.files[0]);
    };
    inp.click();
  });

  function runOcr(file) {
    if (!file) return;

    var preview = $('preview');
    if (preview) {
      preview.src = URL.createObjectURL(file);
      preview.classList.add('active');
    }
    var prog = $('progress');
    if (prog) {
      prog.classList.add('active');
      prog.textContent = 'Распознаю…';
    }

    if (typeof Tesseract === 'undefined') {
      alert('Tesseract.js не загружен. Проверьте интернет.');
      if (prog) prog.classList.remove('active');
      return;
    }

    Tesseract.recognize(file, 'deu', {
      logger: function (m) {
        if (m && m.status === 'recognizing text' && prog) {
          prog.textContent = 'Распознаю… ' + Math.round((m.progress || 0) * 100) + '%';
        }
      }
    }).then(function (result) {
      var text = (result && result.data && result.data.text) ? result.data.text : '';
      var rt = $('rawText');
      if (rt) rt.value = text;
      show('rawBox');

      // Materialnummer
      if (!getVal('material')) {
        var mat = extractMaterial(text) || extract6Digits(text);
        if (mat) {
          setVal('material', mat);
          fillFromCatalog(mat);
        }
      }
      // Charge
      if (!getVal('charge')) {
        var ch = extractCharge(text);
        if (ch) setVal('charge', ch);
      }
      // Gewicht
      if (!getVal('gewicht')) {
        var g = extractGewicht(text);
        if (g) setVal('gewicht', g);
      }
      // Name
      if (!getVal('name').trim()) {
        var nm = extractName(text);
        if (nm) setVal('name', nm);
      }

      toast('OCR обработан');
    }).catch(function (e) {
      console.error(e);
      alert('Ошибка OCR: ' + (e.message || e));
    }).finally(function () {
      if (prog) prog.classList.remove('active');
    });
  }

  // ============================================================
  //  Извлечение из OCR
  // ============================================================
  function extract6Digits(text) {
    if (typeof text !== 'string') return '';
    var m = text.match(/(?:^|\D)(\d{6})(?!\d)/);
    return m ? m[1] : '';
  }

  function extractMaterial(text) {
    if (typeof text !== 'string') return '';
    var lines = text.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    var packRe = /P\s*[AА]\s*C\s*[KК]\s*[\s\-_\.]*S\s*T\s*[UÜUО]\s*C\s*[KК]/i;
    var packIdx = -1;
    for (var i = 0; i < lines.length; i++) {
      if (packRe.test(lines[i])) { packIdx = i; break; }
    }
    if (packIdx >= 0) {
      var candidates = [];
      for (var off = 1; off <= 3; off++) {
        for (var d = -1; d <= 1; d += 2) {
          var idx = packIdx + d * off;
          if (idx < 0 || idx >= lines.length) continue;
          var matches = lines[idx].match(/\b\d{6}\b/g);
          if (matches) {
            for (var k = 0; k < matches.length; k++) {
              candidates.push({ value: matches[k], dist: off });
            }
          }
        }
      }
      if (candidates.length) {
        candidates.sort(function(a,b){return a.dist - b.dist;});
        return candidates[0].value;
      }
    }
    var topLimit = Math.max(3, Math.ceil(lines.length * 0.25));
    for (var j = 0; j < topLimit; j++) {
      var m = lines[j].match(/\b\d{6}\b/);
      if (m) return m[0];
    }
    return '';
  }

  function extractCharge(text) {
    if (typeof text !== 'string') return '';
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      if (/CHARGEN/i.test(lines[i])) {
        var s = lines[i].replace(/\$/g, 'S').replace(/[|!]/g, '1').replace(/O/g, '0');
        var m = s.match(/(\d[\d\s]{4,8}\d)/);
        if (m) {
          var digits = m[1].replace(/\s/g, '');
          if (digits.length >= 5 && digits.length <= 9) return 'SR' + digits;
        }
      }
    }
    var m2 = text.match(/S[RB]\s*(\d{6,8})/i);
    if (m2) return 'SR' + m2[1];
    return '';
  }

  function extractGewicht(text) {
    if (typeof text !== 'string') return '';
    var up = text.toUpperCase();
    var g = '';
    var netto = up.match(/NETTO[^\d]{0,15}(\d+)[.,](\d+)\s*(KG|G)?/);
    if (netto) {
      var decPart = netto[2];
      if (/^00[5689]$/.test(decPart)) decPart = '000';
      g = netto[1] + '.' + decPart;
      if (netto[3] === 'G') g = (parseFloat(g) / 1000).toFixed(3);
    } else {
      var g2 = up.match(/(\d+)[.,](\d{2,3})\s*KG/);
      if (g2) {
        var dec = g2[2];
        if (/^00[5689]$/.test(dec)) dec = '000';
        g = g2[1] + '.' + dec;
      }
    }
    return g;
  }

  function extractName(text) {
    if (typeof text !== 'string') return '';
    var lines = text.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    var brands = /(ELASTOSIL|FLASTOSIL|LASTOSIL|WACKER|SILICONE|TEROSON|LOCTITE|SIKA)/i;
    for (var i = 0; i < lines.length; i++) {
      if (brands.test(lines[i])) {
        var s = lines[i].replace(/[®©Ⓡ"']/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
        var bm = s.match(brands);
        if (bm) s = s.substring(bm.index);
        s = s.replace(/^F?LA?STOSIL/, 'ELASTOSIL');
        var mm = s.match(/^(ELASTOSIL\s+M\s*\d{2,4}\s*[A-ZА-Я]?)/);
        if (mm) s = mm[1].trim();
        if (/ELASTOSIL\s*M\s*46/i.test(s)) return 'ELASTOSIL M 4601 A';
        if (s.length >= 4) return s;
      }
    }
    return '';
  }

  // --- Запуск ---
  render();
  console.log('Etiketten Scanner initialized');

})();
</script>
